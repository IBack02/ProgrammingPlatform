<!doctype html>
<html lang="{{ ui_lang }}" data-theme-role="student">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ T.guest_enter }}</title>
  <style>
    body{margin:0;background:#f3f6fc;color:#17213a;font:16px/1.6 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    .guest-card{width:100%;max-width:440px;padding:32px;box-sizing:border-box;background:white;border:1px solid #dce5f3;border-radius:24px;box-shadow:0 18px 55px #1b397015}
    h1{line-height:1.2;font-size:28px;overflow-wrap:anywhere}.badge{color:#2563eb;font-size:13px;font-weight:700;letter-spacing:.06em}
    .muted{color:#64748b}button{width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:inherit;font-weight:700;cursor:pointer}.error{color:#b91c1c;background:#fff1f2;padding:14px;border-radius:12px}
    html[data-theme="dark"] body{background:#0f172a;color:#e2e8f0}html[data-theme="dark"] .guest-card{background:#172238;border-color:#334155}html[data-theme="dark"] .muted{color:#a6b5ce}
  </style>
  {% include "core/_theme_support.html" %}
</head>
<body><main class="guest-card">
  <div class="badge">DBUG · {{ T.guest_class }}</div>
  <h1>{{ group.name }}</h1>
  <p class="muted">{{ T.guest_intro }}</p>
  {% if all_busy %}<p class="error" role="alert">{{ T.guest_busy }}</p>{% endif %}
  <form method="post">{% csrf_token %}<button type="submit">{{ T.guest_enter }}</button></form>
  <p class="muted"><small>{{ T.guest_lifetime }}</small></p>
</main></body>
</html>
