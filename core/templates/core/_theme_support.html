{% load static %}
<script>
  (() => {
    const storageKey = "programming-platform-theme";
    let theme = "light";
    try {
      const savedTheme = window.localStorage.getItem(storageKey);
      if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
    } catch (error) {
      // The site remains usable when browser storage is unavailable.
    }
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  })();
</script>
<style>
  :root{
    --theme-deep:#021024;
    --theme-deep-soft:#052659;
    --theme-surface:#5483b3;
    --theme-surface-soft:#7da0ca;
    --theme-accent:#c1e8ff;
    --theme-text:#c1e8ff;
  }

  html[data-theme="light"]{color-scheme:light}
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:var(--theme-deep) !important;
    --card:rgba(5,38,89,.96) !important;
    --border:var(--theme-surface-soft) !important;
    --line:var(--theme-surface-soft) !important;
    --ink:var(--theme-text) !important;
    --muted:var(--theme-surface-soft) !important;
    --paper:rgba(5,38,89,.97) !important;
    --primary:var(--theme-deep-soft) !important;
    --blue:var(--theme-surface-soft) !important;
    --sky:var(--theme-deep-soft) !important;
    --hintbg:var(--theme-deep-soft) !important;
    --hintborder:var(--theme-surface-soft) !important;
    --grade-ink:var(--theme-text) !important;
    --grade-line:var(--theme-surface-soft) !important;
    --grade-sky:var(--theme-deep-soft) !important;
    --grade-blue:var(--theme-surface) !important;
    --peer-ink:var(--theme-text) !important;
    --peer-line:var(--theme-surface-soft) !important;
    --peer-sky:var(--theme-deep-soft) !important;
    --peer-blue:var(--theme-surface) !important;
    --peer-warm:rgba(84,131,179,.22) !important;
  }

  html[data-theme-role="teacher"] body,
  html[data-theme-role="student"] body{
    background-repeat:no-repeat !important;
    background-position:center 62% !important;
    background-size:cover !important;
    background-attachment:fixed !important;
  }
  html[data-theme="light"][data-theme-role="teacher"] body{
    background-image:url("{% static 'teacher.png' %}") !important;
  }
  html[data-theme="light"][data-theme-role="student"] body{
    background-image:url("{% static 'student.png' %}") !important;
  }
  html[data-theme="dark"][data-theme-role="teacher"] body{
    background-color:var(--theme-deep) !important;
    background-image:url("{% static 'teaacher_night.png' %}") !important;
  }
  html[data-theme="dark"][data-theme-role="student"] body{
    background-color:var(--theme-deep) !important;
    background-image:url("{% static 'student_night.png' %}") !important;
  }
  html[data-theme="dark"][data-theme-role="student"] body .content{
    background-color:var(--theme-deep) !important;
    background-image:url("{% static 'student_night.png' %}") !important;
  }
  html[data-theme="dark"] body{
    color:var(--theme-text);
  }

  html[data-theme="dark"] body :where(
    .card,
    .panel,
    .panel-card,
    header.topbar,
    .sidebar,
    .paper,
    .question,
    .question-card,
    .summary-card,
    .profile-card,
    .stat-card,
    .session-item,
    .session-card,
    .exam-card,
    .item-btn,
    .attempt-btn,
    .taskbtn,
    .task-item,
    .module-item,
    .question-item,
    .review-card,
    .result-work,
    .peer-session,
    .student-card,
    .assigned-row,
    .search-row,
    .modal,
    .block,
    .workbar,
    .work-btn,
    .question-btn,
    .theoryContent,
    .quizQuestion,
    .editor-panel,
    .list-panel,
    .flipCard,
    .wonder-main,
    .wonder-log,
    .wonderPlayArea,
    .wonderStudentLog,
    #metricsChartWrap
  ){
    background-color:rgba(5,38,89,.96) !important;
    border-color:var(--theme-surface-soft) !important;
    color:var(--theme-text) !important;
    box-shadow:0 14px 32px rgba(0,0,0,.24);
  }
  html[data-theme="dark"] body.auth-page > .wrap{
    background:rgba(5,38,89,.96) !important;
    border-color:var(--theme-surface-soft) !important;
    color:var(--theme-text) !important;
    box-shadow:0 18px 48px rgba(0,0,0,.32);
  }
  html[data-theme="dark"] body :where(.workspace,.main,.scroll,.layout,.content,.app){
    color:var(--theme-text);
  }
  html[data-theme="dark"] body :where(input,textarea,select,.input-ui,.select-ui,.textarea-ui){
    background:var(--theme-deep-soft) !important;
    border-color:var(--theme-surface-soft) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(input,textarea)::placeholder{
    color:var(--theme-accent);
    opacity:.72;
  }
  html[data-theme="dark"] body :where(.btn,.ghost,.link,.action.secondary,.lang-select){
    background:var(--theme-deep-soft) !important;
    border-color:var(--theme-surface-soft) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(
    .btn.active,
    .active,
    .selected,
    .taskbtn.active,
    .question-btn.active,
    .work-btn.active,
    .peer-session.active,
    .item-btn:hover,
    .attempt-btn:hover
  ){
    background-color:var(--theme-deep-soft) !important;
    border-color:var(--theme-accent) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(button[type="submit"],.primary,.save,.save-grade,.action:not(.secondary):not(.danger)){
    background:var(--theme-surface-soft) !important;
    border-color:var(--theme-accent) !important;
    color:var(--theme-deep) !important;
  }
  html[data-theme="dark"] body :where(.danger,.btn.danger,.action.danger){
    background:#7f1d1d !important;
    border-color:#ef4444 !important;
    color:#fee2e2 !important;
  }
  html[data-theme="dark"] body :where(.muted,.small,.small-muted,.hint,.meta,.account,.account-line,.lang-label,.section-title,.field label,.workbar-title){
    color:var(--theme-accent) !important;
  }
  html[data-theme="dark"] body a:not(.btn):not(.primary):not(.ghost):not(.link){
    color:var(--theme-accent);
  }
  html[data-theme="dark"] body :where(.pill,.badge,.points,.status-chip,.moderation,.peer-pill,.reviewer-pill){
    background:rgba(84,131,179,.28) !important;
    border-color:var(--theme-surface-soft) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(table,.exam-table,.review-table){
    background:var(--theme-deep-soft) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(th,td){
    border-color:var(--theme-surface-soft) !important;
  }
  html[data-theme="dark"] body th{
    background:var(--theme-surface) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(pre,code,.code-font,.gamePromptStage,.tournament-bracket-viewport,.tournamentBracketViewport){
    border-color:var(--theme-surface-soft) !important;
  }
  html[data-theme="dark"] body :where(.chart-switch,.submit-row,.diagram-bar,.closed,.feedback,.match-left,.exam-table td.given,.diagram-preview,.empty){
    background:rgba(5,38,89,.94) !important;
    border-color:var(--theme-surface-soft) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(.message.info,.section.mark-scheme,.block.mark,.block.scheme,.teacher-note){
    background:var(--theme-deep-soft) !important;
    border-color:var(--theme-surface) !important;
    color:var(--theme-text) !important;
  }
  html[data-theme="dark"] body :where(.message.ok,.moderation.objective){
    background:#164e3b !important;
    color:#bbf7d0 !important;
  }
  html[data-theme="dark"] body :where(.message.err,.message.error,.moderation.incorrect,.integrity){
    background:#4c1d1d !important;
    color:#fecaca !important;
  }
  html[data-theme="dark"] ::selection{
    background:var(--theme-accent);
    color:var(--theme-deep);
  }
  html[data-theme="dark"] *{
    scrollbar-color:var(--theme-surface-soft) var(--theme-deep);
  }

  .site-theme-toggle{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:900;
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    padding:0;
    border:1px solid rgba(84,131,179,.48);
    border-radius:50%;
    background:rgba(255,255,255,.92);
    color:#052659;
    box-shadow:0 10px 28px rgba(2,16,36,.2);
    backdrop-filter:blur(10px);
    cursor:pointer;
    transition:transform .18s ease,background-color .18s ease,color .18s ease,box-shadow .18s ease;
  }
  .site-theme-toggle:hover{transform:translateY(-2px) rotate(-6deg);box-shadow:0 14px 32px rgba(2,16,36,.28)}
  .site-theme-toggle:focus-visible{outline:3px solid #7da0ca;outline-offset:3px}
  .site-theme-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .site-theme-toggle .theme-icon-sun{display:none}
  html[data-theme="dark"] .site-theme-toggle{
    background:rgba(5,38,89,.95) !important;
    border-color:#7da0ca !important;
    color:#c1e8ff !important;
  }
  html[data-theme="dark"] .site-theme-toggle .theme-icon-moon{display:none}
  html[data-theme="dark"] .site-theme-toggle .theme-icon-sun{display:block}
  @media(max-width:640px){.site-theme-toggle{left:12px;bottom:12px;width:40px;height:40px}}
  @media(prefers-reduced-motion:reduce){.site-theme-toggle{transition:none}}
</style>
<script>
  (() => {
    const storageKey = "programming-platform-theme";
    const darkLabel = "{{ T.enable_dark_theme|default:'Enable dark theme'|escapejs }}";
    const lightLabel = "{{ T.enable_light_theme|default:'Enable light theme'|escapejs }}";

    function currentTheme(){
      return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
    }

    function syncCharts(){
      if (!window.Chart || !window.Chart.instances) return;
      const dark = currentTheme() === "dark";
      const text = dark ? "#c1e8ff" : "#666666";
      const grid = dark ? "rgba(125,160,202,.24)" : "rgba(0,0,0,.1)";
      Object.values(window.Chart.instances).forEach((chart) => {
        if (!chart?.options) return;
        chart.options.color = text;
        if (chart.options.plugins?.legend?.labels) chart.options.plugins.legend.labels.color = text;
        Object.values(chart.options.scales || {}).forEach((scale) => {
          if (scale.ticks) scale.ticks.color = text;
          if (scale.grid) scale.grid.color = grid;
          if (scale.title) scale.title.color = text;
        });
        chart.update("none");
      });
    }

    function syncButton(button){
      const dark = currentTheme() === "dark";
      const label = dark ? lightLabel : darkLabel;
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
      button.setAttribute("aria-pressed", String(dark));
    }

    function mountThemeToggle(){
      if (document.querySelector("[data-site-theme-toggle]")) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "site-theme-toggle";
      button.dataset.siteThemeToggle = "";
      button.innerHTML = `
        <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.1A8.7 8.7 0 0 1 8.9 3.3 8.8 8.8 0 1 0 20.7 15.1Z"></path></svg>
        <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>`;
      syncButton(button);
      button.addEventListener("click", () => {
        const theme = currentTheme() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        try { window.localStorage.setItem(storageKey, theme); } catch (error) {}
        syncButton(button);
        syncCharts();
        window.dispatchEvent(new CustomEvent("site-theme-change", {detail:{theme}}));
      });
      document.body.appendChild(button);
      syncCharts();
      window.setTimeout(syncCharts, 250);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountThemeToggle, {once:true});
    } else {
      mountThemeToggle();
    }
  })();
</script>
