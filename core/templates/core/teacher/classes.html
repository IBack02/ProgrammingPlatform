{% extends "core/teacher/_base.html" %}
{% block title %}{{ T.manage_classes }}{% endblock %}
{% block subtitle %}{{ T.classes_subtitle }}{% endblock %}

{% block content %}
<style>
  .class-row{margin:10px 0;padding:10px;border:1px solid #eef2f7;border-radius:12px;background:#fafafa}
  .class-student-badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#eef6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:13px;font-weight:700}
</style>
<div class="card" style="margin-bottom:12px;">
  <div style="font-weight:900;margin-bottom:8px;">{{ T.create_new_class }}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <input
      id="newClassName"
      placeholder="{{ T.class_name_placeholder }}"
      style="padding:10px;border:1px solid #e5e7eb;border-radius:10px;min-width:240px;"
    />
    <label style="display:flex;align-items:center;gap:8px"><input id="newClassGuest" type="checkbox"> {{ T.guest_class }}</label>
    <button class="btn" id="createBtn" type="button">{{ T.create }}</button>
  </div>
  <div class="muted" id="msg" style="margin-top:8px;"></div>
</div>

<div class="card">
  <div style="font-weight:900;margin-bottom:8px;">{{ T.all_classes }}</div>
  <div id="list"></div>
</div>

<script>
  const UI = {
    noClassesYet: "{{ T.no_classes_yet|escapejs }}",
    noStudentsInClass: "{{ T.no_students_in_class|escapejs }}",
    enterClassName: "{{ T.enter_class_name|escapejs }}",
    created: "{{ T.created|escapejs }}",
    saved: "{{ T.saved|escapejs }}",
    deleted: "{{ T.deleted|escapejs }}",
    createFailed: "{{ T.create_failed|escapejs }}",
    saveFailed: "{{ T.save_failed|escapejs }}",
    deleteFailed: "{{ T.delete_failed|escapejs }}",
    failedToLoadClasses: "{{ T.failed_to_load_classes|escapejs }}",
    deleteClassConfirm: "{{ T.delete_class_confirm|escapejs }}",
    save: "{{ T.save|escapejs }}",
    delete: "{{ T.delete|escapejs }}",
    view: "{{ T.view|escapejs }}",
    hide: "{{ T.hide|escapejs }}",
    studentsOfClass: "{{ T.students_of_class|escapejs }}",
    studentsCount: "{{ T.students_count|escapejs }}",
    idLabel: "{{ T.id_label|escapejs }}"
  };

  let expandedClassId = null;

  function escapeHtml(text){
    return String(text || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getCookie(name){
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return decodeURIComponent(parts.pop().split(";").shift());
    return "";
  }

  function addCsrfHeader(opts){
    const method = String(opts.method || "GET").toUpperCase();
    if (!["GET", "HEAD", "OPTIONS", "TRACE"].includes(method)){
      const token = getCookie("csrftoken");
      if (token) opts.headers["X-CSRFToken"] = token;
    }
  }
  async function api(url, method="GET", body=null){
    const opts = {
      method,
      credentials: "include",
      headers: {
        "Accept": "application/json"
      }
    };

    if (body){
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    addCsrfHeader(opts);

    const r = await fetch(url, opts);

    const contentType = r.headers.get("content-type") || "";
    if (!contentType.includes("application/json")){
      const text = await r.text();
      return {
        status: r.status,
        data: {
          ok: false,
          error: `Expected JSON, got ${r.status}. ${text.slice(0, 200)}`
        }
      };
    }

    const data = await r.json();
    return {status:r.status, data};
  }

  function setMsg(text){
    document.getElementById("msg").textContent = text || "";
  }

  function renderStudentBadges(students){
    if (!students || !students.length){
      return `<div class="muted">${escapeHtml(UI.noStudentsInClass)}</div>`;
    }

    return `
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
        ${students.map(s => `
          <div class="class-student-badge">
            ${escapeHtml(s.full_name)}
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderList(items){
    const root = document.getElementById("list");
    root.innerHTML = "";

    if (!items.length){
      root.innerHTML = `<div class="muted">${escapeHtml(UI.noClassesYet)}</div>`;
      return;
    }

    items.forEach(c => {
      const wrapper = document.createElement("div");
      wrapper.className = "class-row";

      const isExpanded = expandedClassId === c.id;

      wrapper.innerHTML = `
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <input
            data-id="${c.id}"
            value="${escapeHtml(c.name)}"
            style="padding:10px;border:1px solid #e5e7eb;border-radius:10px;min-width:240px;"
          />

          <button class="btn" data-save="${c.id}" type="button">${escapeHtml(UI.save)}</button>
          <button class="btn" data-view="${c.id}" type="button">${isExpanded ? escapeHtml(UI.hide) : escapeHtml(UI.view)}</button>
          <button class="btn" data-del="${c.id}" type="button" style="border-color:#fca5a5;">${escapeHtml(UI.delete)}</button>

          <span class="muted">${escapeHtml(UI.idLabel)}=${c.id}</span>
          <span class="muted">${escapeHtml(UI.studentsCount)}: ${c.student_count || 0}</span>
        </div>

        ${c.is_guest ? `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:18px">
          <img src="/teacher/classes/${c.id}/guest-qr/" alt="QR" width="180" height="180" style="background:white;border-radius:12px">
          <div style="min-width:0;flex:1">
            <strong>{{ T.guest_class|escapejs }}</strong><p>{{ T.guest_available|escapejs }}: ${c.guest_available} / ${c.student_count}</p>
            <input aria-label="{{ T.guest_link|escapejs }}" readonly value="${escapeHtml(new URL(c.guest_url, location.origin).href)}" style="width:100%;box-sizing:border-box;padding:10px" onclick="this.select()">
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
              <a class="btn" href="/teacher/classes/${c.id}/guest-qr/?download=1">{{ T.guest_download_qr|escapejs }}</a>
              <a class="btn" href="/teacher/students/?class_id=${c.id}">{{ T.guest_add|escapejs }}</a>
              <button class="btn" type="button" data-release-guests="${c.id}" style="border-color:#fca5a5">{{ T.guest_release_all|escapejs }}</button>
            </div><div data-guest-notice="${c.id}" role="status" aria-live="polite" style="margin-top:8px"></div><p class="muted">{{ T.guest_lifetime|escapejs }}</p>
          </div>
        </div>` : ''}
        <div id="students-${c.id}" style="margin-top:12px; ${isExpanded ? '' : 'display:none;'}">
          <div style="font-weight:800; margin-bottom:4px;">${escapeHtml(UI.studentsOfClass)}</div>
          ${renderStudentBadges(c.students || [])}
        </div>
      `;

      root.appendChild(wrapper);
    });

    root.querySelectorAll("button[data-release-guests]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.releaseGuests;
        const notice = () => root.querySelector(`[data-guest-notice="${id}"]`);
        btn.disabled = true;
        notice().textContent = "{{ T.guest_releasing|escapejs }}";
        try {
          const res = await api(`/api/teacher/classes/${id}/release-guests/`, "POST");
          if (!res.data.ok) throw new Error(res.data.error || "{{ T.guest_release_failed|escapejs }}");
          await load();
          if (notice()) notice().textContent = "{{ T.guest_released|escapejs }}";
        } catch (error) {
          if (notice()) notice().textContent = error.message || "{{ T.guest_release_failed|escapejs }}";
        } finally {
          btn.disabled = false;
        }
      });
    });

    root.querySelectorAll("button[data-save]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-save");
        const inp = root.querySelector(`input[data-id="${id}"]`);
        const name = (inp.value || "").trim();

        const res = await api(`/api/teacher/classes/${id}/`, "PATCH", {name});
        if (!res.data.ok){
          setMsg(res.data.error || UI.saveFailed);
          return;
        }

        setMsg(UI.saved);
        await load();
      });
    });

    root.querySelectorAll("button[data-del]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-del");
        if (!confirm(UI.deleteClassConfirm)) return;

        const res = await api(`/api/teacher/classes/${id}/`, "DELETE");
        if (!res.data.ok){
          setMsg(res.data.error || UI.deleteFailed);
          return;
        }

        if (expandedClassId === Number(id)) {
          expandedClassId = null;
        }

        setMsg(UI.deleted);
        await load();
      });
    });

    root.querySelectorAll("button[data-view]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = Number(btn.getAttribute("data-view"));
        expandedClassId = expandedClassId === id ? null : id;
        await load();
      });
    });
  }

  async function load(){
    setMsg("");

    const res = await api("/api/teacher/classes/");
    if (!res.data.ok){
      setMsg(res.data.error || UI.failedToLoadClasses);
      return;
    }

    renderList(res.data.classes || []);
    const hasGuest = (res.data.classes || []).some(c => c.is_guest);
    document.getElementById("newClassGuest").disabled = hasGuest;
    if (hasGuest) document.getElementById("newClassGuest").checked = false;
  }

  document.getElementById("createBtn").addEventListener("click", async () => {
    const name = (document.getElementById("newClassName").value || "").trim();
    if (!name){
      setMsg(UI.enterClassName);
      return;
    }

    const res = await api("/api/teacher/classes/", "POST", {name, is_guest: document.getElementById("newClassGuest").checked});
    if (!res.data.ok){
      setMsg(res.data.error || UI.createFailed);
      return;
    }

    document.getElementById("newClassName").value = "";
    setMsg(UI.created);
    await load();
  });

  load();
</script>
{% endblock %}
