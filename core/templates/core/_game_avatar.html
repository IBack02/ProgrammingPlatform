{% load static tower_avatar %}
{% avatar_geometry as attachment_geometry %}{{ attachment_geometry|json_script:'game-avatar-geometry' }}
<link rel="stylesheet" href="{% static 'tower/avatar.css' %}">
<style>
  .gameAvatar{width:46px;height:46px;flex-shrink:0;position:relative;filter:drop-shadow(0 5px 5px rgba(15,23,42,.25))}
  .gameAvatarBody{position:absolute;inset:0;background:var(--runner-color);border-radius:10px}
  .gameAvatarBody.triangle{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
  .gameAvatarBody.diamond{transform:rotate(45deg);inset:7px;border-radius:6px}
  .gameAvatarBody.pentagon{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);border-radius:0}
  .gameAvatarBody.hexagon{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border-radius:0}
  .gameEye{position:absolute;z-index:3;top:14px;width:13px;height:15px;background:#fff;border:2px solid #0f172a;border-radius:50%;overflow:hidden;transform-origin:center}
  .gameEye.left{left:8px}
  .gameEye.right{right:8px}
  .gameEye:after{content:"";position:absolute;width:5px;height:5px;background:#0f172a;border-radius:50%;left:3px;top:4px;transform:translateX(var(--gaze-x,-2px))}
  .gameAvatar[data-animated] .gameEye:after{animation:gameGaze var(--gaze-period) steps(1,end) infinite;animation-delay:var(--gaze-delay)}
  .gameAvatar[data-animated] .gameEye{animation:gameBlink var(--blink-period) linear infinite;animation-delay:var(--blink-delay)}
  @keyframes gameGaze{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
  @keyframes gameBlink{0%,97.8%,100%{transform:scaleY(1)}98.9%{transform:scaleY(.08)}}
  .gamePlayerIdentity{display:inline-flex;align-items:center;gap:8px;min-width:0}.gamePlayerName{min-width:0;overflow:hidden;text-overflow:ellipsis}.gameAvatarPortrait{display:inline-grid;place-items:center;width:34px;height:34px;flex:none;position:relative}.gameAvatarPortrait>.gameAvatar{transform:scale(.64);transform-origin:center}
  .tournamentPlayer .gameAvatarPortrait,.tournament-player .gameAvatarPortrait{width:24px;height:24px}.tournamentPlayer .gameAvatarPortrait>.gameAvatar,.tournament-player .gameAvatarPortrait>.gameAvatar{transform:scale(.48)}.tournamentPlayer .gamePlayerName,.tournament-player .gamePlayerName{white-space:nowrap}
  .gameDuelScore{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:12px 8px}.gameDuelScore>.gamePlayerIdentity{max-width:40%;font-size:14px}.gameDuelScore .gamePlayerName{white-space:normal}.gameDuelNumbers{font-variant-numeric:tabular-nums;white-space:nowrap}.gameCurrentResponder{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.gameCurrentResponder .gameAvatarPortrait{width:54px;height:54px}.gameCurrentResponder .gameAvatarPortrait>.gameAvatar{transform:scale(1)}
  @media(prefers-reduced-motion:reduce){.gameAvatar[data-animated] .gameEye:after,.gameAvatar[data-animated] .gameEye{animation:none}.gameEye:after{transform:none}}
</style>
<script>
  function gameAvatarHtml(player){
    const allowedAccessories = ["cap", "crown", "round-glasses", "sunglasses", "mustache"];
    const anchor = JSON.parse(document.getElementById("game-avatar-geometry").textContent).shapes[player.avatar_shape]?.anchors.head;
    const accessories = Object.values(player.avatar_accessories || {}).filter(value => allowedAccessories.includes(value)).map(value => {
      const item = `<span class="gameAvatarAccessory gameAvatarAccessory--${value}" aria-hidden="true"></span>`;
      if (!["cap", "crown"].includes(value) || !anchor) return item;
      const transform = `translate(${anchor.point.x * 46}px, ${anchor.point.y * 46}px) rotate(${anchor.rotation}deg) scale(${anchor.span}) translate(-23px, -1.84px)`;
      return `<span class="gameAvatarLegacyHead" style="transform:${transform}" aria-hidden="true">${item}</span>`;
    }).join("");
    const images = Array.isArray(player.avatar_accessories?._set_items) ? player.avatar_accessories._set_items : [];
    const attachments = layer => {
      const content = images.filter(item => item.layer === layer && item.matrices?.[player.avatar_shape]).map(item =>
        `<image href="${escapeHtml(item.url)}" width="${Number(item.width)}" height="${Number(item.height)}" transform="${escapeHtml(item.matrices[player.avatar_shape])}"/>`).join("");
      return content ? `<svg class="tower-set-attachments tower-set-attachments--${layer}" viewBox="0 0 100 100" aria-hidden="true">${content}</svg>` : "";
    };
    const motionKey = player.student_id ?? player.id ?? `${player.avatar_shape}:${player.avatar_color}`;
    return `<div class="gameAvatar" data-motion-key="${escapeHtml(String(motionKey))}" style="--runner-color:${escapeHtml(player.avatar_color)}">${attachments("behind")}<div class="gameAvatarBody ${escapeHtml(player.avatar_shape)}"></div><span class="gameEye left"></span><span class="gameEye right"></span>${accessories}${attachments("front")}</div>`;
  }

  function animateGameAvatars(container){
    container.querySelectorAll(".gameAvatar:not([data-animated])").forEach(avatar => {
      avatar.dataset.animated = "true";
      let seed = 0;
      for (const char of avatar.dataset.motionKey || "avatar") seed = (Math.imul(seed, 31) + char.charCodeAt(0)) >>> 0;
      seed = Math.imul(seed ^ (seed >>> 16), 0x7feb352d) >>> 0;
      seed = Math.imul(seed ^ (seed >>> 15), 0x846ca68b) >>> 0;
      seed = (seed ^ (seed >>> 16)) >>> 0;
      const gazePeriod = 5400 + seed % 601, blinkPeriod = 8000 + seed % 1001;
      // Negative delays retain the participant's phase even when live polling replaces nodes.
      const now = performance.now() + seed;
      avatar.style.setProperty("--gaze-period", `${gazePeriod}ms`);
      avatar.style.setProperty("--gaze-delay", `${-(now % gazePeriod)}ms`);
      avatar.style.setProperty("--blink-period", `${blinkPeriod}ms`);
      avatar.style.setProperty("--blink-delay", `${-(now % blinkPeriod)}ms`);
    });
  }

  function gameParticipantLabelHtml(player, fallback="—"){
    if (!player) return `<span class="gamePlayerName">${escapeHtml(fallback)}</span>`;
    return `<span class="gamePlayerIdentity"><span class="gameAvatarPortrait" aria-hidden="true">${gameAvatarHtml(player)}</span><span class="gamePlayerName">${escapeHtml(player.student_name || fallback)}</span></span>`;
  }

  function renderGameDuelScore(container, match){
    container.classList.add("gameDuelScore");
    container.innerHTML = `${gameParticipantLabelHtml(match.player_one)}<strong class="gameDuelNumbers">${Number(match.score_one)} : ${Number(match.score_two)}</strong>${gameParticipantLabelHtml(match.player_two)}`;
    animateGameAvatars(container);
  }
</script>
