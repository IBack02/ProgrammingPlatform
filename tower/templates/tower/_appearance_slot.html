<label>{{ slot.label }}<select name="{{ slot.id }}"><option value="">{% if slot.id == 'background' or slot.id == 'ui_loader' %}{{ T.journal_standard }}{% elif slot.id == 'companion' %}{{ T.journal_no_companion }}{% else %}{{ T.journal_none }}{% endif %}</option>{% for item in slot.items %}<option value="{{ item.id }}" {% if slot.selected == item.id %}selected{% endif %}>{{ item.label }}{% if item.placeholder %} · {{ T.journal_set_chibi_placeholder }}{% endif %}</option>{% endfor %}</select>{% if not slot.items %}<small>{% if slot.id == 'glasses' or slot.id == 'mustache' %}{{ T.journal_shop_slot_hint }}{% else %}{{ T.journal_slot_empty }}{% endif %}</small>{% endif %}</label>
