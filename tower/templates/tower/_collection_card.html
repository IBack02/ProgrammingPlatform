<article class="collection-card collection-card--{{ card.rarity }}{% if card.state %} collection-card--{{ card.state }}{% endif %}" data-card-rarity="{{ card.rarity }}" aria-label="{{ card.name }} · {{ card.role }} · {{ card.rarity_label }} · {{ card.star_count }} ★">
  <div class="collection-card__placeholder" aria-hidden="true">NIS</div>
  {% if card.state != 'undiscovered' %}<img class="collection-card__portrait" src="{{ card.portrait_url }}" alt="{{ card.name }} — {{ card.role }}" width="1024" height="1536" loading="lazy" decoding="async">{% endif %}
  <img class="collection-card__frame" src="{{ card.frame_url }}" alt="" aria-hidden="true" width="512" height="768" decoding="async">
  <div class="collection-card__copy"><h2>{{ card.name }}</h2><p>{{ card.role }}</p></div>
  <div class="collection-card__stars" aria-hidden="true">
    {% for star in card.stars %}<svg viewBox="0 0 24 24" focusable="false"><path d="m12 1.5 3.2 6.6 7.3 1.1-5.3 5.1 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1.1Z"/></svg>{% endfor %}
  </div>
</article>
